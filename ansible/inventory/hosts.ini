# ---------------------------------------------------------------
# Inventaire Ansible — projet devops-final
# ---------------------------------------------------------------

[app]
app-1 ansible_host=52.47.158.151
app-2 ansible_host=13.37.237.26

# Le load balancer Nginx tourne sur les instances app
[load_balancer]
app-1 ansible_host=52.47.158.151
app-2 ansible_host=13.37.237.26

# La BDD est RDS (accès depuis les instances app uniquement)
[database]
app-1 ansible_host=52.47.158.151

# Le backup tourne sur une instance app
[backup]
app-1 ansible_host=52.47.158.151

# Outils CI/CD — instance isolée du réseau applicatif
[citools]
citools-1 ansible_host=CITOOLS_PUBLIC_IP

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=../terraform/devops-final-key.pem
ansible_python_interpreter=/usr/bin/python3
