---
# SonarQube requiert vm.max_map_count >= 524288 (comme Elasticsearch)
- name: Configurer vm.max_map_count (requis par SonarQube)
  sysctl:
    name: vm.max_map_count
    value: "524288"
    state: present
    reload: true

- name: Configurer fs.file-max
  sysctl:
    name: fs.file-max
    value: "131072"
    state: present
    reload: true

- name: Configurer les limites ulimit pour sonarqube
  blockinfile:
    path: /etc/security/limits.conf
    block: |
      sonarqube   -   nofile   131072
      sonarqube   -   nproc    8192
    marker: "# {mark} ANSIBLE MANAGED BLOCK - sonarqube limits"

- name: Installer Java 17 (requis par SonarQube 10.x)
  dnf:
    name: java-17-amazon-corretto
    state: present

- name: Installer unzip
  dnf:
    name: unzip
    state: present

- name: Créer l'utilisateur sonarqube (sans shell login)
  user:
    name: sonarqube
    shell: /bin/bash
    create_home: true
    state: present

- name: Créer le répertoire d'installation
  file:
    path: /opt/sonarqube
    state: directory
    owner: sonarqube
    group: sonarqube
    mode: '0755'

- name: Télécharger SonarQube Community Edition
  get_url:
    url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
    dest: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
    mode: '0644'

- name: Décompresser SonarQube
  unarchive:
    src: "/tmp/sonarqube-{{ sonarqube_version }}.zip"
    dest: /opt/sonarqube
    remote_src: true
    extra_opts: ["--strip-components=1"]
    owner: sonarqube
    group: sonarqube
    creates: /opt/sonarqube/bin

- name: Déployer le service systemd SonarQube
  template:
    src: sonarqube.service.j2
    dest: /etc/systemd/system/sonarqube.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd

- name: Démarrer et activer SonarQube
  systemd:
    name: sonarqube
    state: started
    enabled: true
    daemon_reload: true

- name: Attendre que SonarQube soit prêt (port 9000)
  wait_for:
    port: 9000
    delay: 30
    timeout: 180
