---
- name: Installer Node.js 20
  block:
    - name: Ajouter le dépôt NodeSource
      shell: curl -fsSL https://rpm.nodesource.com/setup_20.x | bash -
      args:
        creates: /etc/yum.repos.d/nodesource-el9.repo

    - name: Installer nodejs
      dnf:
        name: nodejs
        state: present

- name: Installer PM2 globalement
  npm:
    name: pm2
    global: true
    state: present

- name: Créer l'utilisateur applicatif
  user:
    name: "{{ app_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Créer le répertoire de l'application
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0755'

- name: Déployer le fichier d'environnement
  template:
    src: env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: '0600'
  notify: restart app

- name: Copier les sources de l'application
  synchronize:
    src: "{{ playbook_dir }}/../app/"
    dest: "{{ app_dir }}/"
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.git"
      - "--exclude=.next"
  become_user: "{{ app_user }}"
  notify: restart app

- name: Installer les dépendances npm
  npm:
    path: "{{ app_dir }}"
    state: present
  become_user: "{{ app_user }}"

- name: Build de l'application TypeScript SSR
  command: npm run build
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  notify: restart app

- name: Démarrer l'application avec PM2
  command: >
    pm2 start npm --name "{{ project_name }}" -- start
  args:
    chdir: "{{ app_dir }}"
  become_user: "{{ app_user }}"
  ignore_errors: true

- name: Sauvegarder la liste PM2 pour redémarrage automatique
  command: pm2 save
  become_user: "{{ app_user }}"

- name: Configurer PM2 au démarrage système
  command: pm2 startup systemd -u {{ app_user }} --hp /home/{{ app_user }}
  register: pm2_startup
  changed_when: false

- name: Activer le service PM2
  systemd:
    name: "pm2-{{ app_user }}"
    enabled: true
    daemon_reload: true
