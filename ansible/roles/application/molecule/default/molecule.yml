---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: molecule-amazonlinux2023:latest
    dockerfile: Dockerfile
    command: /usr/lib/systemd/systemd
    privileged: true
    pre_build_image: false
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../../"
  inventory:
    host_vars:
      instance:
        project_name: devops-final
        app_port: 3000
        app_dir: /app
        app_user: appuser
        db_host: localhost
        db_port: 5432
        db_name: appdb
        db_user: appuser
        db_password: testpassword
verifier:
  name: ansible
scenario:
  # On retire idempotence : npm build et pm2 start ne sont pas idempotents par nature
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
