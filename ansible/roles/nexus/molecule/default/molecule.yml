---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: molecule-amazonlinux2023:latest
    dockerfile: Dockerfile
    command: /usr/lib/systemd/systemd
    privileged: true
    pre_build_image: false
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../../"
  inventory:
    host_vars:
      instance:
        project_name: devops-final
        nexus_version: "3.66.0-02"
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - verify
    - cleanup
    - destroy
