---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: instance
    image: molecule-amazonlinux2023:latest
    dockerfile: Dockerfile
    command: /usr/lib/systemd/systemd
    privileged: true
    pre_build_image: false
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../../"
  inventory:
    host_vars:
      instance:
        app_user: appuser
        db_host: localhost
        db_port: 5432
        db_name: appdb
        db_user: appuser
        db_password: testpassword
        s3_backup_bucket: test-backup-bucket
        aws_region: eu-west-3
verifier:
  name: ansible
